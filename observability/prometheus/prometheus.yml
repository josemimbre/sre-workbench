global:
  # The playground SLO windows are minutes, not days: a 15s scrape interval would not
  # give enough samples for a 5m burn rate to mean anything.
  scrape_interval: 5s
  evaluation_interval: 5s

# Phase 2 drops the SLO recording/alerting rules generated by Sloth in here.
rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # The `job` label is what identifies a service in every SLI query (PLAN.md §6).
  # Services never emit a `service` label of their own to avoid a relabel conflict.
  - job_name: checkout-api
    static_configs:
      - targets: ["checkout-api:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
