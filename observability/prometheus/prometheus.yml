global:
  # The playground SLO windows are minutes, not days: a 15s scrape interval would not
  # give enough samples for a 5m burn rate to mean anything.
  scrape_interval: 5s
  evaluation_interval: 5s

# Recording rules and burn-rate alerts, generated from observability/slo by `make slo-gen`.
rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The `job` label is what identifies a service in every SLI query.
  # Services never emit a `service` label of their own to avoid a relabel conflict.
  - job_name: checkout-api
    static_configs:
      - targets: ["checkout-api:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
