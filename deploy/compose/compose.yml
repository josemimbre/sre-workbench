name: sre-workbench

services:
  checkout-api:
    build:
      context: ../../services
      args:
        SERVICE: checkout-api
    environment:
      PORT: "8080"
      VERSION: v1
      BASE_LATENCY_MS: "40"
    ports:
      - "8080:8080"
    restart: unless-stopped

  console:
    build:
      context: ../../services
      args:
        SERVICE: console
    environment:
      PORT: "8090"
      SERVICES: checkout-api=http://checkout-api:8080
      PROMETHEUS_URL: http://prometheus:9090
      # The links in the header are opened by your browser, not by the container, so
      # they have to be the published ports rather than the compose network names.
      PROMETHEUS_PUBLIC_URL: http://localhost:9090
      GRAFANA_URL: http://localhost:3000/d/workbench-red
    ports:
      - "8090:8090"
    depends_on:
      - checkout-api
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      # k6 pushes the client-side view of the SLI through remote write.
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ../../observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local playground: no login wall between you and the dashboards.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ../../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  loadgen:
    image: grafana/k6:2.2.0
    command:
      - run
      # --quiet: the per-second progress bar would drown every other service in
      # `make logs`. What k6 measures is in Prometheus anyway.
      - --quiet
      - --out
      - experimental-prometheus-rw
      - /scripts/checkout.js
    environment:
      TARGET: http://checkout-api:8080
      RATE: "20"
      DURATION: "720h"
      INVALID_RATE: "0.02"
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99)
    volumes:
      - ../../loadgen:/scripts:ro
    depends_on:
      - checkout-api
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
